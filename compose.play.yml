services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: colony
      POSTGRES_DB: colony
      POSTGRES_PASSWORD: ${PLAY_DB_PASSWORD:?Use the play launcher to create local configuration}
    volumes:
      - play_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U colony -d colony']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://colony:${PLAY_DB_PASSWORD}@db:5432/colony
      BETTER_AUTH_SECRET: ${PLAY_AUTH_SECRET:?Use the play launcher to create local configuration}
      APP_ORIGIN: http://localhost:8080
      NODE_ENV: development
      PORT: '3001'
    ports:
      - '127.0.0.1:8080:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 30
    restart: unless-stopped
volumes:
  play_data:
