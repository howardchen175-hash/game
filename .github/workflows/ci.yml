name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: colony
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: colony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U colony"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://colony:ci-only-ephemeral@localhost:5432/colony
      BETTER_AUTH_SECRET: ci-only-ephemeral-secret-for-isolated-test-runs-2026
      APP_ORIGIN: http://localhost:5173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser validation
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          npm run test:e2e
